name: Export and deploy World Fight

on:
  push:
    branches: [main]
  schedule:
    # Refresh the analytics dashboard (the game is re-exported with it).
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Godot 4.7.2 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/web
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --export-release Web export/web/index.html
          python tools/patch_web_export.py
          touch export/web/.nojekyll
          test -s export/web/index.html
          test -s export/web/index.wasm
          test -s export/web/index.pck

      - name: Build analytics dashboard
        # Needs the repository secret GOATCOUNTER_TOKEN (read-only API token).
        # Without it, or if GoatCounter is unreachable, the game still deploys.
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOATCOUNTER_TOKEN" ]; then echo "No GOATCOUNTER_TOKEN secret; skipping dashboard"; exit 0; fi
          pip install --quiet pillow
          python tools/build_dashboard.py --days 30 --out export/web/analytics/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: export/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
